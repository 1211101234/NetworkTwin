<header class="app-header">
  <a class="brand" routerLink="/" aria-label="Network Twin home">
    <span class="brand-mark" aria-hidden="true">NT</span>
    <span
      ><strong>Network Twin</strong><small>Spatial intelligence & scenario planning</small></span
    >
  </a>
  <div class="header-actions">
    <span class="phase-badge">Phase 2 · Live twin</span>
    @if (auth.currentUser(); as user) {
      <span class="user-name">{{ user.displayName }}</span>
      <button type="button" (click)="logout()">Sign out</button>
    } @else if (!auth.loading()) {
      <a class="login-link" routerLink="/login">Sign in</a>
    }
  </div>
</header>
<main><router-outlet /></main>
