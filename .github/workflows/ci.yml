name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Lint backend
        working-directory: backend
        run: uv run ruff check .
      - name: Check Django configuration and migrations
        working-directory: backend
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
      - name: Validate and refresh-check OpenAPI schema
        working-directory: backend
        run: |
          uv run python manage.py spectacular --file /tmp/openapi.yaml --validate
          diff -u ../docs/api/openapi.yaml /tmp/openapi.yaml
      - name: Test backend
        working-directory: backend
        run: uv run pytest -q
      - name: Lint simulation
        run: backend/.venv/bin/ruff check simulation
      - name: Test simulation
        run: backend/.venv/bin/pytest -q simulation/tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Test
        run: npm run test:ci
      - name: Type-check
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Production build
        run: npm run build
