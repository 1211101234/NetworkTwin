openapi: 3.0.3
info:
  title: Network Digital Twin API
  version: 0.1.0
  description: Synthetic network assets, topology, and simulation events.
paths:
  /api/health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  database:
                    type: string
                    example: ok
                required:
                - status
                - database
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - ht
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/csrf/:
    get:
      operationId: v1_auth_csrf_retrieve
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrfToken:
                    type: string
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          description: No response body
  /api/v1/topology/:
    get:
      operationId: v1_topology_retrieve
      summary: Generate a deterministic synthetic network topology
      parameters:
      - in: query
        name: cabinet_count
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 6
      - in: query
        name: distribution_points_per_cabinet
        schema:
          type: integer
          maximum: 20
          minimum: 1
          default: 4
      - in: query
        name: premises_per_distribution_point
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 5
      - in: query
        name: profile
        schema:
          enum:
          - demo
          - 1k
          - 5k
          - 10k
          - custom
          type: string
          default: demo
          minLength: 1
        description: |-
          * `demo` - demo
          * `1k` - 1k
          * `5k` - 5k
          * `10k` - 10k
          * `custom` - custom
      - in: query
        name: seed
        schema:
          type: integer
          maximum: 2147483647
          minimum: 0
          default: 20260929
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topology'
          description: ''
  /api/v1/topology/events/:
    get:
      operationId: v1_topology_events_list
      summary: Get a deterministic ordered simulation event log
      parameters:
      - in: query
        name: cabinet_count
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 6
      - in: query
        name: distribution_points_per_cabinet
        schema:
          type: integer
          maximum: 20
          minimum: 1
          default: 4
      - in: query
        name: premises_per_distribution_point
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 5
      - in: query
        name: profile
        schema:
          enum:
          - demo
          - 1k
          - 5k
          - 10k
          - custom
          type: string
          default: demo
          minLength: 1
        description: |-
          * `demo` - demo
          * `1k` - 1k
          * `5k` - 5k
          * `10k` - 10k
          * `custom` - custom
      - in: query
        name: seed
        schema:
          type: integer
          maximum: 2147483647
          minimum: 0
          default: 20260929
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SimulationEvent'
          description: ''
  /api/v1/topology/events/stream/:
    get:
      operationId: v1_topology_events_stream_retrieve
      summary: Stream deterministic simulation events with resume support
      parameters:
      - in: query
        name: after
        schema:
          type: integer
        description: Resume after this event sequence
      - in: query
        name: cabinet_count
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 6
      - in: query
        name: distribution_points_per_cabinet
        schema:
          type: integer
          maximum: 20
          minimum: 1
          default: 4
      - in: query
        name: premises_per_distribution_point
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 5
      - in: query
        name: profile
        schema:
          enum:
          - demo
          - 1k
          - 5k
          - 10k
          - custom
          type: string
          default: demo
          minLength: 1
        description: |-
          * `demo` - demo
          * `1k` - 1k
          * `5k` - 5k
          * `10k` - 10k
          * `custom` - custom
      - in: query
        name: seed
        schema:
          type: integer
          maximum: 2147483647
          minimum: 0
          default: 20260929
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                type: string
          description: ''
  /api/v1/topology/impact/:
    get:
      operationId: v1_topology_impact_retrieve
      summary: Calculate direct and transitive downstream asset impact
      parameters:
      - in: query
        name: asset_id
        schema:
          type: string
          maxLength: 100
          minLength: 1
        required: true
      - in: query
        name: cabinet_count
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 6
      - in: query
        name: distribution_points_per_cabinet
        schema:
          type: integer
          maximum: 20
          minimum: 1
          default: 4
      - in: query
        name: premises_per_distribution_point
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 5
      - in: query
        name: profile
        schema:
          enum:
          - demo
          - 1k
          - 5k
          - 10k
          - custom
          type: string
          default: demo
          minLength: 1
        description: |-
          * `demo` - demo
          * `1k` - 1k
          * `5k` - 5k
          * `10k` - 10k
          * `custom` - custom
      - in: query
        name: seed
        schema:
          type: integer
          maximum: 2147483647
          minimum: 0
          default: 20260929
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependencyImpact'
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    Asset:
      type: object
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/AssetTypeEnum'
        name:
          type: string
        position:
          $ref: '#/components/schemas/Position'
        parentId:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/AssetStatusEnum'
        capacity:
          type: integer
          minimum: 0
        attributes:
          type: object
          additionalProperties: {}
      required:
      - attributes
      - capacity
      - id
      - name
      - parentId
      - position
      - status
      - type
    AssetStatusEnum:
      enum:
      - operational
      - degraded
      - failed
      - maintenance
      type: string
      description: |-
        * `operational` - operational
        * `degraded` - degraded
        * `failed` - failed
        * `maintenance` - maintenance
    AssetTypeEnum:
      enum:
      - exchange
      - cabinet
      - distribution-point
      - premise
      type: string
      description: |-
        * `exchange` - exchange
        * `cabinet` - cabinet
        * `distribution-point` - distribution-point
        * `premise` - premise
    CurrentUser:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
        isAdministrator:
          type: boolean
      required:
      - displayName
      - id
      - isAdministrator
      - roles
      - username
    DependencyImpact:
      type: object
      properties:
        sourceAssetId:
          type: string
        sourceAssetType:
          $ref: '#/components/schemas/AssetTypeEnum'
        directDependentCount:
          type: integer
          minimum: 0
        impactedAssetCount:
          type: integer
          minimum: 0
        affectedPremiseCount:
          type: integer
          minimum: 0
        impactedAssets:
          type: array
          items:
            $ref: '#/components/schemas/ImpactedAsset'
      required:
      - affectedPremiseCount
      - directDependentCount
      - impactedAssetCount
      - impactedAssets
      - sourceAssetId
      - sourceAssetType
    ImpactedAsset:
      type: object
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/AssetTypeEnum'
        name:
          type: string
        depth:
          type: integer
          minimum: 1
      required:
      - depth
      - id
      - name
      - type
    Login:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - password
      - username
    MediumEnum:
      enum:
      - fibre
      - copper
      - wireless
      type: string
      description: |-
        * `fibre` - fibre
        * `copper` - copper
        * `wireless` - wireless
    Position:
      type: object
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
      required:
      - latitude
      - longitude
    Register:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - password
      - username
    Route:
      type: object
      properties:
        id:
          type: string
        sourceAssetId:
          type: string
        targetAssetId:
          type: string
        path:
          type: array
          items:
            $ref: '#/components/schemas/Position'
        medium:
          $ref: '#/components/schemas/MediumEnum'
      required:
      - id
      - medium
      - path
      - sourceAssetId
      - targetAssetId
    SimulationEvent:
      type: object
      properties:
        id:
          type: string
        schemaVersion:
          type: string
        sequence:
          type: integer
          minimum: 1
        simulationTimeSeconds:
          type: integer
          minimum: 0
        type:
          $ref: '#/components/schemas/SimulationEventTypeEnum'
        payload:
          type: object
          additionalProperties: {}
      required:
      - id
      - payload
      - schemaVersion
      - sequence
      - simulationTimeSeconds
      - type
    SimulationEventTypeEnum:
      enum:
      - asset-status-changed
      - technician-position-changed
      type: string
      description: |-
        * `asset-status-changed` - asset-status-changed
        * `technician-position-changed` - technician-position-changed
    Topology:
      type: object
      properties:
        seed:
          type: integer
        geography:
          type: string
        assetCount:
          type: integer
        routeCount:
          type: integer
        assets:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
        routes:
          type: array
          items:
            $ref: '#/components/schemas/Route'
      required:
      - assetCount
      - assets
      - geography
      - routeCount
      - routes
      - seed
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
